<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PulseTap Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { user-select: none; touch-action: manipulation; background: #0f172a; color: white; }
        .tap-btn:active { transform: scale(0.95); }
        .floating-text { position: absolute; animation: floatUp 0.8s ease-out forwards; color: #38bdf8; font-weight: bold; font-size: 20px; pointer-events: none; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-80px); } }
    </style>
</head>
<body class="flex flex-col h-screen justify-between p-4 max-w-md mx-auto">

    <!-- Header -->
    <div class="bg-slate-800/80 rounded-2xl p-4 flex items-center justify-between border border-slate-700 shadow-lg">
        <div class="flex items-center gap-3">
            <img id="user-avatar" src="https://via.placeholder.com/50" class="w-12 h-12 rounded-full border-2 border-cyan-400">
            <div>
                <h2 id="user-name" class="font-bold text-sm">User</h2>
                <div class="text-xs text-yellow-400">Level <span id="user-level">1</span></div>
            </div>
        </div>
        <button onclick="claimDaily()" class="bg-gradient-to-r from-green-500 to-green-700 text-xs px-4 py-2 rounded-full font-bold shadow-lg hover:scale-105 transition">🎁 Daily Bonus</button>
    </div>

    <!-- Balance & Timer -->
    <div class="text-center my-4">
        <div class="flex items-center justify-center gap-2 mb-2">
            <i class="fa-solid fa-coins text-yellow-400 text-3xl animate-pulse"></i>
            <span id="coin-balance" class="text-5xl font-black tracking-tight text-white shadow-cyan-500 drop-shadow-md">0</span>
        </div>
        <div class="inline-block bg-slate-800 px-4 py-1 rounded-full text-xs text-cyan-400 border border-slate-700">
            Max <span id="finger-limit" class="font-bold">2</span> Taps | ⏱️ Auto Ad in: <span id="ad-timer" class="font-bold text-white">0s</span>
        </div>
    </div>

    <!-- Tapping Area -->
    <div class="relative flex justify-center items-center my-auto h-64" id="tap-area">
        <button id="tap-btn" class="tap-btn w-60 h-60 rounded-full bg-gradient-to-b from-cyan-600 to-blue-800 p-2 shadow-[0_0_50px_rgba(6,182,212,0.6)] border-4 border-cyan-300 flex justify-center items-center">
            <div class="w-full h-full rounded-full bg-slate-900/30 flex flex-col items-center justify-center">
                <i class="fa-solid fa-bolt text-5xl text-cyan-200 mb-2"></i>
                <span class="text-xs font-bold text-cyan-100 tracking-widest">TAP NOW</span>
            </div>
        </button>
    </div>

    <!-- Autosave Status Indicator -->
    <div class="text-center text-[10px] text-slate-400 mb-1 flex items-center justify-center gap-1">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        <span>Autosave active</span>
    </div>

    <!-- Bottom Navigation -->
    <div class="grid grid-cols-3 gap-2 bg-slate-800 p-3 rounded-2xl border border-slate-700 text-center shadow-xl">
        <button onclick="switchTab('mine')" class="text-cyan-400 flex flex-col items-center gap-1"><i class="fa-solid fa-pickaxe text-lg"></i><span class="text-[10px]">Mine</span></button>
        <button onclick="switchTab('tasks')" class="text-slate-400 hover:text-white flex flex-col items-center gap-1 transition"><i class="fa-solid fa-list-check text-lg"></i><span class="text-[10px]">Tasks</span></button>
        <button onclick="switchTab('wallet')" class="text-slate-400 hover:text-white flex flex-col items-center gap-1 transition"><i class="fa-solid fa-wallet text-lg"></i><span class="text-[10px]">Withdraw</span></button>
    </div>

    <!-- TASKS MODAL -->
    <div id="modal-tasks" class="hidden fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-50 p-4 flex flex-col justify-center items-center">
        <div class="bg-slate-800 p-6 rounded-3xl w-full max-w-sm border border-slate-700 shadow-2xl">
            <h3 class="text-2xl font-black mb-6 text-center text-cyan-400">📋 Earn More Coins</h3>
            
            <div class="bg-slate-900 p-4 rounded-2xl mb-4 flex justify-between items-center border border-slate-700">
                <div>
                    <div class="text-sm font-bold text-white">Join Our Telegram</div>
                    <div class="text-xs text-yellow-400 mt-1 font-semibold">+50,000 Coins</div>
                </div>
                <button onclick="verifyTask('telegram')" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-xs font-bold transition shadow-lg">Verify</button>
            </div>

            <button onclick="closeModals()" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-xl mt-4 font-bold transition">Close Window</button>
        </div>
    </div>

    <!-- WALLET MODAL -->
    <div id="modal-wallet" class="hidden fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-50 p-4 flex flex-col justify-center items-center">
        <div class="bg-slate-800 p-6 rounded-3xl w-full max-w-sm border border-slate-700 text-center shadow-2xl">
            <h3 class="text-2xl font-black mb-2 text-green-400">💸 Cashout</h3>
            <p class="text-xs mb-6 text-slate-400 bg-slate-900 py-2 rounded-lg">Minimum Withdraw: 1,000,000 Coins</p>
            
            <div class="text-left mb-4">
                <label class="text-xs text-slate-400 ml-1">Payment Details (Bkash/Nagad/Crypto)</label>
                <input id="w-address" type="text" placeholder="Enter Account / Address" class="w-full bg-slate-900 p-3 mt-1 rounded-xl text-white border border-slate-600 focus:border-cyan-400 outline-none">
            </div>
            
            <div class="text-left mb-6">
                <label class="text-xs text-slate-400 ml-1">Withdraw Amount</label>
                <input id="w-amount" type="number" placeholder="e.g. 1000000" class="w-full bg-slate-900 p-3 mt-1 rounded-xl text-white border border-slate-600 focus:border-cyan-400 outline-none">
            </div>
            
            <button onclick="submitWithdraw()" class="w-full bg-gradient-to-r from-green-600 to-emerald-600 font-bold py-3 rounded-xl shadow-lg hover:opacity-90 transition">Send Request to Admin</button>
            <button onclick="closeModals()" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-xl mt-3 font-bold transition">Close Window</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let user = {
            id: tg.initDataUnsafe?.user?.id || 12345,
            name: tg.initDataUnsafe?.user?.first_name || "Gamer",
            photo: tg.initDataUnsafe?.user?.photo_url || "https://via.placeholder.com/50",
            coins: parseInt(localStorage.getItem('coins')) || 0,
            level: parseInt(localStorage.getItem('level')) || 1,
            maxFingers: parseInt(localStorage.getItem('maxFingers')) || 2,
            lastClaim: parseInt(localStorage.getItem('lastClaim')) || 0
        };

        // UI Header setup
        document.getElementById('user-name').innerText = user.name;
        if(tg.initDataUnsafe?.user?.photo_url) {
            document.getElementById('user-avatar').src = user.photo;
        }

        // Auto Load from Telegram Cloud Storage on start
        if (tg.CloudStorage) {
            tg.CloudStorage.getItems(['coins', 'level', 'lastClaim'], (err, values) => {
                if (!err && values) {
                    if (values.coins) user.coins = parseInt(values.coins);
                    if (values.level) user.level = parseInt(values.level);
                    if (values.lastClaim) user.lastClaim = parseInt(values.lastClaim);
                    updateUI();
                }
            });
        }

        function updateUI() {
            document.getElementById('coin-balance').innerText = user.coins.toLocaleString();
            document.getElementById('user-level').innerText = user.level;
            document.getElementById('finger-limit').innerText = user.maxFingers;
        }

        // Realtime AutoSave function (Local + Telegram Cloud)
        function autoSave() {
            localStorage.setItem('coins', user.coins);
            localStorage.setItem('level', user.level);
            localStorage.setItem('lastClaim', user.lastClaim);

            if (tg.CloudStorage) {
                tg.CloudStorage.setItem('coins', user.coins.toString());
                tg.CloudStorage.setItem('level', user.level.toString());
                tg.CloudStorage.setItem('lastClaim', user.lastClaim.toString());
            }
        }

        // Automatic background save every 2 seconds
        setInterval(autoSave, 2000);

        // Save when app is closed or minimized
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                autoSave();
            }
        });

        // Tap Mechanic
        const tapArea = document.getElementById('tap-btn');
        tapArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let touches = Math.min(e.touches.length, user.maxFingers);
            user.coins += (touches * 1);
            checkLevel();
            localStorage.setItem('coins', user.coins); // Immediate local save
            updateUI();
            
            for(let i=0; i<touches; i++) {
                showFloat('+1', e.touches[i].clientX, e.touches[i].clientY);
            }
            tg.HapticFeedback?.impactOccurred('light');
        });

        function showFloat(text, x, y) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x-10}px`; el.style.top = `${y-20}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function checkLevel() {
            if (user.coins >= user.level * 1000) {
                user.level++;
                tg.HapticFeedback?.notificationOccurred('success');
            }
        }

        function getAutoAdInterval() {
            let interval = 300 - ((user.level - 1) * 10);
            return Math.max(120, interval); // Min 2 minutes
        }

        let nextAdTimestamp = parseInt(localStorage.getItem('nextAdTimestamp'));
        if (!nextAdTimestamp || isNaN(nextAdTimestamp)) {
            nextAdTimestamp = Date.now() + (getAutoAdInterval() * 1000);
            localStorage.setItem('nextAdTimestamp', nextAdTimestamp);
        }

        setInterval(() => {
            let now = Date.now();
            let remainingSeconds = Math.max(0, Math.ceil((nextAdTimestamp - now) / 1000));
            document.getElementById('ad-timer').innerText = `${remainingSeconds}s`;

            if (remainingSeconds <= 0) {
                triggerAutoAd();
                nextAdTimestamp = Date.now() + (getAutoAdInterval() * 1000);
                localStorage.setItem('nextAdTimestamp', nextAdTimestamp);
            }
        }, 1000);

        function triggerAutoAd() {
            const adUrl = "https://www.profitableratecpmnetwork.com/ubupygs3?key=511d31b0135289fc6ee4ff0f18b63a18";
            if(tg.openLink) {
                tg.openLink(adUrl);
            } else {
                window.open(adUrl, '_blank');
            }
        }

        function claimDaily() {
            let now = Date.now();
            if (now - user.lastClaim > 86400000) {
                user.coins += 5000;
                user.lastClaim = now;
                autoSave(); updateUI();
                tg.showAlert("🎁 Daily Bonus Claimed! +5,000 Coins");
                tg.HapticFeedback?.notificationOccurred('success');
            } else {
                let hours = Math.floor((86400000 - (now - user.lastClaim)) / 3600000);
                tg.showAlert(`⏳ Come back in ${hours} hours for next bonus!`);
            }
        }

        function submitWithdraw() {
            let address = document.getElementById('w-address').value;
            let amount = parseInt(document.getElementById('w-amount').value);
            if (!address) return tg.showAlert("❌ Enter payment details!");
            if (amount < 1000000) return tg.showAlert("❌ Minimum 1,000,000 Coins!");
            if (amount > user.coins) return tg.showAlert("❌ Not enough coins!");
            
            user.coins -= amount; autoSave(); updateUI();
            
            tg.sendData(JSON.stringify({
                action: "withdraw_request",
                userId: user.id, userName: user.name,
                address: address, amount: amount
            }));
        }

        function verifyTask(type) {
            tg.sendData(JSON.stringify({
                action: "verify_task",
                userId: user.id, type: type
            }));
        }

        function switchTab(tab) {
            closeModals();
            if(tab === 'tasks') document.getElementById('modal-tasks').classList.remove('hidden');
            if(tab === 'wallet') document.getElementById('modal-wallet').classList.remove('hidden');
        }
        function closeModals() {
            document.getElementById('modal-tasks').classList.add('hidden');
            document.getElementById('modal-wallet').classList.add('hidden');
        }
        
        updateUI();
    </script>
</body>
</html>
