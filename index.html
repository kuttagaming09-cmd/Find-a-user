<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Referral App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0; padding: 20px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .balance { font-size: 24px; font-weight: bold; color: var(--tg-theme-button-color, #3390ec); }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 15px; border-radius: 10px; margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; padding: 10px 15px; border-radius: 5px;
            cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px;
        }
        input, textarea {
            width: 100%; padding: 10px; margin: 5px 0 15px 0; border-radius: 5px;
            border: 1px solid #ccc; box-sizing: border-box;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .nav-tabs { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .nav-tab { flex: 1; text-align: center; padding: 10px; background: #ddd; cursor: pointer; }
        .nav-tab.active { background: var(--tg-theme-button-color, #3390ec); color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h2>P2P Referral system</h2>
        <div>আপনার টোকেন: <span class="balance" id="token-balance">0</span></div>
    </div>

    <div class="nav-tabs">
        <div class="nav-tab active" onclick="switchTab('tasks')">এভেইলেবল টাস্ক</div>
        <div class="nav-tab" onclick="switchTab('create')">টাস্ক দিন</div>
    </div>

    <!-- Available Tasks Section -->
    <div id="tasks-section">
        <h3>অন্যদের টাস্ক করে টোকেন আয় করুন</h3>
        <div id="task-list">লোড হচ্ছে...</div>
    </div>

    <!-- Create Task Section -->
    <div id="create-section" class="hidden">
        <h3>নতুন টাস্ক পাবলিশ করুন</h3>
        <p>১টি টাস্ক/স্লট = ১ টোকেন</p>
        <input type="text" id="t-title" placeholder="টাস্কের নাম (যেমন: Join My Bot)">
        <textarea id="t-desc" rows="3" placeholder="বিস্তারিত ডেসক্রিপশন..."></textarea>
        <input type="url" id="t-link" placeholder="রেফার লিংক বা বট লিংক">
        <input type="number" id="t-slots" placeholder="কতজন জয়েন করাতে চান?" min="1" value="1">
        <button class="btn" onclick="createTask()">পাবলিশ করুন</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ⚠️ আপনার Python API সার্ভারের লিংক এখানে দিন 
        // (যেহেতু আপনি নিজে হোস্ট করবেন, আপনার সার্ভারের আইপি বা ডোমেইন এখানে দিবেন)
        const API_URL = "http://127.0.0.1:5000/api"; 
        
        let user = tg.initDataUnsafe.user || { id: 123456, first_name: "Test User" }; // Fallback for browser testing

        // টোকেন লোড করা
        async function loadUser() {
            try {
                let res = await fetch(`${API_URL}/user/${user.id}`);
                let data = await res.json();
                if (data.success) document.getElementById('token-balance').innerText = data.tokens;
            } catch (e) { console.error("Error loading user", e); }
        }

        // টাস্ক লোড করা
        async function loadTasks() {
            try {
                let res = await fetch(`${API_URL}/tasks`);
                let data = await res.json();
                let list = document.getElementById('task-list');
                list.innerHTML = "";
                
                if (data.tasks.length === 0) {
                    list.innerHTML = "<p>বর্তমানে কোনো টাস্ক নেই।</p>"; return;
                }

                data.tasks.forEach(t => {
                    list.innerHTML += `
                        <div class="card">
                            <h4>${t.title}</h4>
                            <p>${t.description}</p>
                            <a href="${t.link}" target="_blank"><button class="btn" style="background:#28a745;">লিংকে যান</button></a>
                            <input type="text" id="proof-${t.id}" placeholder="প্রুফ দিন (আপনার টেলিগ্রাম ইউজারনেম)">
                            <button class="btn" onclick="submitProof(${t.id})">সম্পন্ন করেছি (Submit Proof)</button>
                        </div>
                    `;
                });
            } catch (e) { console.error("Error loading tasks", e); }
        }

        // টাস্ক তৈরি করা
        async function createTask() {
            let title = document.getElementById('t-title').value;
            let desc = document.getElementById('t-desc').value;
            let link = document.getElementById('t-link').value;
            let slots = document.getElementById('t-slots').value;

            if(!title || !desc || !link) return tg.showAlert("সবগুলো ঘর পূরণ করুন!");

            let res = await fetch(`${API_URL}/task/create`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: user.id, title: title, description: desc, link: link, slots: slots })
            });
            let data = await res.json();
            tg.showAlert(data.message);
            if(data.success) {
                switchTab('tasks');
                loadUser();
            }
        }

        // প্রুফ সাবমিট করা
        async function submitProof(taskId) {
            let proof = document.getElementById(`proof-${taskId}`).value;
            if(!proof) return tg.showAlert("অনুগ্রহ করে প্রুফ হিসেবে আপনার নাম/ইউজারনেম দিন!");

            let res = await fetch(`${API_URL}/task/submit`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ task_id: taskId, worker_id: user.id, worker_name: user.first_name, proof_text: proof })
            });
            let data = await res.json();
            tg.showAlert(data.message);
            if(data.success) loadTasks();
        }

        function switchTab(tab) {
            document.getElementById('tasks-section').classList.add('hidden');
            document.getElementById('create-section').classList.add('hidden');
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tab + '-section').classList.remove('hidden');
            event.target.classList.add('active');
            if(tab === 'tasks') loadTasks();
        }

        // ইনিশিয়াল লোড
        loadUser();
        loadTasks();
    </script>
</body>
</html>
