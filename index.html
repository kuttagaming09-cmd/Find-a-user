<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PulseTap Studio Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { user-select: none; touch-action: manipulation; background: #0f172a; color: white; overflow: hidden; }
        .tap-btn { transition: transform 0.05s ease; }
        .tap-btn:active { transform: scale(0.92); }
        .floating-text { position: absolute; animation: floatUp 0.8s ease-out forwards; color: #38bdf8; font-weight: 900; font-size: 24px; pointer-events: none; text-shadow: 0 0 5px rgba(0,0,0,0.5); }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(1.2); } }
    </style>
</head>
<body class="flex flex-col h-screen justify-between p-4 max-w-md mx-auto relative">

    <!-- Header & Daily Bonus -->
    <div class="bg-slate-800/90 rounded-2xl p-4 flex items-center justify-between border border-slate-700 shadow-lg backdrop-blur-md">
        <div class="flex items-center gap-3">
            <img id="user-avatar" src="https://via.placeholder.com/50" class="w-12 h-12 rounded-full border-2 border-cyan-400 shadow-[0_0_10px_cyan]">
            <div>
                <h2 id="user-name" class="font-bold text-sm text-gray-100">User</h2>
                <div class="text-xs text-yellow-400 font-semibold">Level <span id="user-level" class="text-white">1</span></div>
            </div>
        </div>
        <button onclick="claimDaily()" class="bg-gradient-to-r from-green-500 to-green-700 text-xs px-4 py-2 rounded-full font-bold shadow-[0_0_15px_rgba(34,197,94,0.4)] hover:scale-105 transition-transform text-white">🎁 Daily Bonus</button>
    </div>

    <!-- Balance & Timer Info -->
    <div class="text-center mt-6 mb-2">
        <div class="flex items-center justify-center gap-3 mb-3">
            <i class="fa-solid fa-coins text-yellow-400 text-4xl animate-bounce"></i>
            <span id="coin-balance" class="text-5xl font-black tracking-tight text-white drop-shadow-[0_0_15px_rgba(6,182,212,0.8)]">0</span>
        </div>
        <div class="inline-block bg-slate-800/80 px-4 py-1.5 rounded-full text-xs text-cyan-300 border border-slate-600 shadow-inner">
            Max <span id="finger-limit" class="font-bold text-white">2</span> Taps | ⏱️ Auto Ad in: <span id="ad-timer" class="font-bold text-red-400">0s</span>
        </div>
        <p class="text-[10px] text-gray-400 mt-2">💾 Auto-saving to device...</p>
    </div>

    <!-- Tapping Area -->
    <div class="relative flex justify-center items-center flex-1 my-4" id="tap-area">
        <button id="tap-btn" class="tap-btn w-64 h-64 rounded-full bg-gradient-to-b from-cyan-500 to-blue-700 p-2 shadow-[0_0_60px_rgba(6,182,212,0.5)] border-4 border-cyan-300 flex justify-center items-center relative overflow-hidden">
            <div class="w-full h-full rounded-full bg-slate-900/40 flex flex-col items-center justify-center relative z-10">
                <i class="fa-solid fa-bolt text-6xl text-cyan-200 mb-2 drop-shadow-[0_0_10px_white]"></i>
                <span class="text-sm font-black text-cyan-100 tracking-[0.2em]">TAP NOW</span>
            </div>
            <!-- Glow effect -->
            <div class="absolute inset-0 bg-cyan-400 opacity-20 rounded-full animate-pulse"></div>
        </button>
    </div>

    <!-- Bottom Navigation Bar (All Options Intact) -->
    <div class="grid grid-cols-4 gap-2 bg-slate-800/90 p-3 rounded-2xl border border-slate-700 text-center shadow-[0_-5px_20px_rgba(0,0,0,0.3)] mb-2">
        <button onclick="switchTab('mine')" class="text-cyan-400 flex flex-col items-center gap-1 hover:scale-105 transition">
            <i class="fa-solid fa-pickaxe text-xl"></i><span class="text-[10px] font-bold">Mine</span>
        </button>
        <button onclick="switchTab('tasks')" class="text-slate-400 hover:text-white flex flex-col items-center gap-1 hover:scale-105 transition">
            <i class="fa-solid fa-list-check text-xl"></i><span class="text-[10px] font-bold">Tasks</span>
        </button>
        <button onclick="switchTab('wallet')" class="text-slate-400 hover:text-white flex flex-col items-center gap-1 hover:scale-105 transition">
            <i class="fa-solid fa-wallet text-xl"></i><span class="text-[10px] font-bold">Withdraw</span>
        </button>
        <!-- Sync to Leaderboard Button -->
        <button onclick="syncBalanceToBot()" class="text-green-400 hover:text-green-300 flex flex-col items-center gap-1 hover:scale-105 transition bg-slate-700/50 rounded-lg p-1">
            <i class="fa-solid fa-cloud-arrow-up text-xl animate-pulse"></i><span class="text-[10px] font-bold">Sync Bot</span>
        </button>
    </div>

    <!-- TASKS MODAL -->
    <div id="modal-tasks" class="hidden fixed inset-0 bg-slate-900/95 backdrop-blur-md z-50 p-4 flex flex-col justify-center items-center">
        <div class="bg-slate-800 p-6 rounded-3xl w-full max-w-sm border border-slate-600 shadow-[0_0_30px_rgba(0,0,0,0.8)]">
            <h3 class="text-2xl font-black mb-6 text-center text-cyan-400"><i class="fa-solid fa-tasks"></i> Earn More Coins</h3>
            
            <div class="bg-slate-900 p-4 rounded-2xl mb-4 flex justify-between items-center border border-slate-700 shadow-inner">
                <div>
                    <div class="text-sm font-bold text-white">Join Our Telegram</div>
                    <div class="text-xs text-yellow-400 mt-1 font-black">+50,000 Coins</div>
                </div>
                <button onclick="verifyTask('telegram')" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-xs font-bold transition shadow-[0_0_10px_blue]">Verify</button>
            </div>

            <button onclick="closeModals()" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-xl mt-4 font-bold transition text-white">✖ Close Tasks</button>
        </div>
    </div>

    <!-- WALLET / WITHDRAW MODAL -->
    <div id="modal-wallet" class="hidden fixed inset-0 bg-slate-900/95 backdrop-blur-md z-50 p-4 flex flex-col justify-center items-center">
        <div class="bg-slate-800 p-6 rounded-3xl w-full max-w-sm border border-slate-600 text-center shadow-[0_0_30px_rgba(0,0,0,0.8)]">
            <h3 class="text-2xl font-black mb-2 text-green-400"><i class="fa-solid fa-money-bill-wave"></i> Cashout</h3>
            <p class="text-xs mb-6 text-slate-300 bg-slate-900 py-2 rounded-lg font-semibold border border-slate-700">Minimum Withdraw: 1,000,000 Coins</p>
            
            <div class="text-left mb-4">
                <label class="text-xs text-slate-400 ml-1 font-bold">Payment Details (Bkash/Nagad/Crypto)</label>
                <input id="w-address" type="text" placeholder="Enter Account Number or Address" class="w-full bg-slate-900 p-3 mt-1 rounded-xl text-white border border-slate-600 focus:border-cyan-400 outline-none transition">
            </div>
            
            <div class="text-left mb-6">
                <label class="text-xs text-slate-400 ml-1 font-bold">Withdraw Amount</label>
                <input id="w-amount" type="number" placeholder="e.g. 1000000" class="w-full bg-slate-900 p-3 mt-1 rounded-xl text-white border border-slate-600 focus:border-cyan-400 outline-none transition">
            </div>
            
            <button onclick="submitWithdraw()" class="w-full bg-gradient-to-r from-green-600 to-emerald-500 font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(34,197,94,0.5)] hover:scale-[1.02] transition text-white">📤 Send Request to Admin</button>
            <button onclick="closeModals()" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-xl mt-3 font-bold transition text-white">✖ Close Wallet</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Load data from LocalStorage (This is the True Autosave for Frontend)
        let user = {
            id: tg.initDataUnsafe?.user?.id || Math.floor(Math.random() * 100000),
            name: tg.initDataUnsafe?.user?.first_name || "Gamer",
            photo: tg.initDataUnsafe?.user?.photo_url || "https://via.placeholder.com/50",
            coins: parseInt(localStorage.getItem('coins')) || 0,
            level: parseInt(localStorage.getItem('level')) || 1,
            maxFingers: parseInt(localStorage.getItem('maxFingers')) || 2,
            lastClaim: parseInt(localStorage.getItem('lastClaim')) || 0
        };

        // UI Setup
        document.getElementById('user-name').innerText = user.name;
        if(tg.initDataUnsafe?.user?.photo_url) {
            document.getElementById('user-avatar').src = user.photo;
        }

        function updateUI() {
            document.getElementById('coin-balance').innerText = user.coins.toLocaleString();
            document.getElementById('user-level').innerText = user.level;
            document.getElementById('finger-limit').innerText = user.maxFingers;
        }

        // Tap Mechanic
        const tapArea = document.getElementById('tap-btn');
        tapArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let touches = Math.min(e.touches.length, user.maxFingers);
            user.coins += (touches * 1);
            checkLevel();
            saveDataLocally(); // <--- Auto-saves to phone instantly. No data lost!
            updateUI();
            
            for(let i=0; i<touches; i++) {
                showFloat('+1', e.touches[i].clientX, e.touches[i].clientY);
            }
            tg.HapticFeedback?.impactOccurred('light');
        });

        function showFloat(text, x, y) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x-15}px`; el.style.top = `${y-30}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function checkLevel() {
            let threshold = user.level * 1000;
            if (user.coins >= threshold) {
                user.level++;
                tg.HapticFeedback?.notificationOccurred('success');
            }
        }

        // --- AUTOSAVE LOCALLY ---
        // এই ফাংশনটি গেমের ব্যালেন্স আপনার মোবাইলের ব্রাউজারে অটো সেভ করে রাখে
        function saveDataLocally() {
            localStorage.setItem('coins', user.coins);
            localStorage.setItem('level', user.level);
            localStorage.setItem('lastClaim', user.lastClaim);
        }

        // --- SYNC TO BOT (LEADERBOARD) ---
        // গেম খেলা শেষ হলে এই ফাংশন দিয়ে ব্যালেন্স বটের কাছে পাঠাবেন
        function syncBalanceToBot() {
            tg.HapticFeedback?.impactOccurred('heavy');
            // ডাটা সেন্ড করলে গেম ক্লোজ হয়ে যাবে, তাই ইউজারকে এলার্ট দেওয়া হলো
            tg.sendData(JSON.stringify({
                action: "save_balance",
                userId: user.id, 
                userName: user.name, 
                coins: user.coins
            }));
        }

        // --- NEW AD NETWORK (PROFITABLE RATE CPM) ---
        function getAutoAdInterval() {
            let interval = 300 - ((user.level - 1) * 10);
            return Math.max(120, interval); // Minimum 2 mins
        }

        let nextAdTimestamp = parseInt(localStorage.getItem('nextAdTimestamp'));
        if (!nextAdTimestamp || isNaN(nextAdTimestamp)) {
            nextAdTimestamp = Date.now() + (getAutoAdInterval() * 1000);
            localStorage.setItem('nextAdTimestamp', nextAdTimestamp);
        }

        setInterval(() => {
            let now = Date.now();
            let remainingSeconds = Math.max(0, Math.ceil((nextAdTimestamp - now) / 1000));
            document.getElementById('ad-timer').innerText = `${remainingSeconds}s`;

            if (remainingSeconds <= 0) {
                triggerAutoAd();
                nextAdTimestamp = Date.now() + (getAutoAdInterval() * 1000);
                localStorage.setItem('nextAdTimestamp', nextAdTimestamp);
            }
        }, 1000);

        function triggerAutoAd() {
            // Your custom Ad URL
            const adUrl = "https://www.profitableratecpmnetwork.com/ubupygs3?key=511d31b0135289fc6ee4ff0f18b63a18";
            if(tg.openLink) {
                tg.openLink(adUrl);
            } else {
                window.open(adUrl, '_blank');
            }
        }

        // --- DAILY BONUS ---
        function claimDaily() {
            let now = Date.now();
            if (now - user.lastClaim > 86400000) {
                user.coins += 5000;
                user.lastClaim = now;
                saveDataLocally(); 
                updateUI();
                tg.showAlert("🎉 5,000 Coins added to your balance!");
                tg.HapticFeedback?.notificationOccurred('success');
            } else {
                let hours = Math.floor((86400000 - (now - user.lastClaim)) / 3600000);
                tg.showAlert(`⏳ Bonus already claimed! Come back in ${hours} hours.`);
            }
        }

        // --- WITHDRAW SYSTEM ---
        function submitWithdraw() {
            let address = document.getElementById('w-address').value;
            let amount = parseInt(document.getElementById('w-amount').value);
            
            if (!address) return tg.showAlert("❌ Please enter your Bkash/Nagad/Crypto address!");
            if (!amount || amount < 1000000) return tg.showAlert("❌ Minimum withdraw amount is 1,000,000 Coins!");
            if (amount > user.coins) return tg.showAlert("❌ You don't have enough coins!");
            
            // Deduct balance and save
            user.coins -= amount; 
            saveDataLocally(); 
            updateUI();
            
            // Send to bot
            tg.sendData(JSON.stringify({
                action: "withdraw_request",
                userId: user.id, 
                userName: user.name,
                address: address, 
                amount: amount
            }));
        }

        // --- TASKS VERIFICATION ---
        function verifyTask(type) {
            tg.sendData(JSON.stringify({
                action: "verify_task",
                userId: user.id, 
                type: type
            }));
        }

        // --- TAB NAVIGATION ---
        function switchTab(tab) {
            closeModals();
            if(tab === 'tasks') document.getElementById('modal-tasks').classList.remove('hidden');
            if(tab === 'wallet') document.getElementById('modal-wallet').classList.remove('hidden');
        }
        function closeModals() {
            document.getElementById('modal-tasks').classList.add('hidden');
            document.getElementById('modal-wallet').classList.add('hidden');
        }

        // Initialize UI
        updateUI();
    </script>
</body>
</html>
